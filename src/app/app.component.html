<!-- Main Application Shell -->
<div class="announcement-bar">
  <div class="announcement-track">

    <span>🔥 LIMITED-TIME OFFER — Book Your FREE QUOTE Today & Get <span style="color: var(--color-gold);">30% OFF</span> on Your Installation! &bull; Call / WhatsApp Now</span>
  </div>
</div>

<app-navbar></app-navbar>

<div class="main-content">
    <router-outlet></router-outlet>
</div>

<app-footer></app-footer>

<!-- Sticky Bottom Mobile Contact Bar -->
<div class="mobile-contact-bar">
    <a [href]="getWhatsAppLink()" target="_blank" rel="noopener noreferrer"
        class="mobile-contact-btn mobile-btn-whatsapp">
        <span>💬 WhatsApp</span>
    </a>
    <a [href]="contact.phoneCallUrl" class="mobile-contact-btn mobile-btn-call">
        <span>📞 Call Now</span>
    </a>
</div>

<!-- Desktop Floating Action Buttons -->
<div class="desktop-floating-actions">
    <a [href]="getWhatsAppLink()" target="_blank" rel="noopener noreferrer" class="floating-btn floating-wa"
        aria-label="Chat on WhatsApp">
        <span>💬</span>
    </a>
    <a [href]="contact.phoneCallUrl" class="floating-btn floating-call" aria-label="Call Customer Care">
        <span>📞</span>
    </a>
</div>
